<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="pcardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="chestGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="340" rx="12" fill="url(#pcardBg)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#3f3f46" stroke-width="0.5" stroke-opacity="0.4">
    <line x1="40" y1="0" x2="40" y2="340"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="280" y1="0" x2="280" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="440" y1="0" x2="440" y2="340"/>
    <line x1="520" y1="0" x2="520" y2="340"/>
    
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
  </g>

  <!-- Window Header Bar (UI preview feel) -->
  <rect x="30" y="25" width="540" height="36" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#ef4444"/>
  <circle cx="68" cy="43" r="5" fill="#eab308"/>
  <circle cx="86" cy="43" r="5" fill="#22c55e"/>
  <rect x="130" y="34" width="220" height="18" rx="4" fill="#18181b"/>
  <text x="145" y="47" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#a1a1aa">pneumon-vision-ai.local</text>
  <rect x="470" y="34" width="85" height="18" rx="4" fill="#ea580c" fill-opacity="0.2"/>
  <text x="480" y="47" font-family="sans-serif" font-size="10" font-weight="600" fill="#f97316">ML SCANNER</text>

  <!-- Left Panel: X-Ray Scanner & Lung Visualization Representation -->
  <rect x="30" y="75" width="280" height="235" rx="8" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
  
  <!-- Diagnostic Crosshair & Reticle -->
  <circle cx="170" cy="185" r="75" fill="none" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="170" cy="185" r="45" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="170" y1="95" x2="170" y2="275" stroke="#3f3f46" stroke-width="0.75" stroke-dasharray="2 2"/>
  <line x1="80" y1="185" x2="260" y2="185" stroke="#3f3f46" stroke-width="0.75" stroke-dasharray="2 2"/>

  <!-- Stylized Lung Lobes (Chest X-Ray diagram) -->
  <!-- Left Lobe -->
  <path d="M 155 130 C 130 135 110 160 110 200 C 110 230 135 245 155 240 C 160 235 162 200 160 160 Z" fill="#27272a" stroke="#ea580c" stroke-width="1.8" opacity="0.85"/>
  <!-- Right Lobe -->
  <path d="M 185 130 C 210 135 230 160 230 200 C 230 230 205 245 185 240 C 180 235 178 200 180 160 Z" fill="#27272a" stroke="#ea580c" stroke-width="1.8" opacity="0.85"/>
  <!-- Trachea / Bronchial connection -->
  <path d="M 170 115 L 170 145 M 170 145 L 155 160 M 170 145 L 185 160" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>

  <!-- Anomaly / Detection Bounding Box -->
  <rect x="190" y="165" width="35" height="40" rx="3" fill="#ea580c" fill-opacity="0.2" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="193" y="160" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fb923c" font-weight="700">DETECTED</text>

  <!-- Scanning laser beam line -->
  <line x1="30" y1="210" x2="310" y2="210" stroke="#f97316" stroke-width="2"/>
  <rect x="30" y="195" width="280" height="15" fill="url(#scanBeam)"/>

  <!-- Right Panel: AI Analytics Dashboard & Metrics -->
  <rect x="325" y="75" width="245" height="235" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>

  <!-- Metric 1: Processing Speed / Wait Time Reduction -->
  <rect x="340" y="90" width="215" height="52" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="0.75"/>
  <text x="352" y="107" font-family="sans-serif" font-size="10" fill="#a1a1aa">HOSPITAL WAIT TIME SAVED</text>
  <text x="352" y="130" font-family="'JetBrains Mono', monospace, sans-serif" font-size="18" font-weight="700" fill="#22c55e">Instant &lt; 2s</text>
  <circle cx="530" cy="116" r="10" fill="#22c55e" fill-opacity="0.15"/>
  <path d="M 526 116 L 529 119 L 535 113" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Metric 2: Model Confidence -->
  <rect x="340" y="150" width="215" height="60" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="0.75"/>
  <text x="352" y="167" font-family="sans-serif" font-size="10" fill="#a1a1aa">CONFIDENCE SCORE</text>
  <text x="352" y="191" font-family="'JetBrains Mono', monospace, sans-serif" font-size="16" font-weight="700" fill="#f97316">98.4% Normal / Viral</text>
  <!-- Progress meter -->
  <rect x="352" y="198" width="190" height="4" rx="2" fill="#3f3f46"/>
  <rect x="352" y="198" width="165" height="4" rx="2" fill="url(#chestGlow)"/>

  <!-- Stack Pills at Bottom of Card -->
  <g transform="translate(340, 222)">
    <!-- Pill 1: Python -->
    <rect x="0" y="0" width="62" height="22" rx="4" fill="#3f3f46" fill-opacity="0.5"/>
    <text x="31" y="14" font-family="sans-serif" font-size="10" font-weight="600" fill="#e4e4e7" text-anchor="middle">Python</text>

    <!-- Pill 2: Flask -->
    <rect x="68" y="0" width="56" height="22" rx="4" fill="#3f3f46" fill-opacity="0.5"/>
    <text x="96" y="14" font-family="sans-serif" font-size="10" font-weight="600" fill="#e4e4e7" text-anchor="middle">Flask</text>

    <!-- Pill 3: HTML -->
    <rect x="130" y="0" width="54" height="22" rx="4" fill="#3f3f46" fill-opacity="0.5"/>
    <text x="157" y="14" font-family="sans-serif" font-size="10" font-weight="600" fill="#e4e4e7" text-anchor="middle">HTML</text>
  </g>

  <!-- Contribution Banner -->
  <g transform="translate(340, 256)">
    <rect width="215" height="42" rx="6" fill="#ea580c" fill-opacity="0.12" stroke="#ea580c" stroke-opacity="0.4"/>
    <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="700" fill="#fb923c">CONTRIBUTION HIGHLIGHT</text>
    <text x="12" y="32" font-family="sans-serif" font-size="10" fill="#d4d4d8">Built frontend user interface</text>
  </g>
</svg>
