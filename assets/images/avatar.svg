<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ea580c" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="120" cy="120" r="110" fill="url(#bgGrad)"/>
  <circle cx="120" cy="120" r="110" fill="url(#gridPattern)"/>

  <!-- Orbital Rings -->
  <circle cx="120" cy="120" r="106" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="120" cy="120" r="92" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Code / Terminal Bracket Accents -->
  <path d="M 50 100 L 38 120 L 50 140" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M 190 100 L 202 120 L 190 140" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Center Hexagonal Crest -->
  <polygon points="120,45 175,77 175,143 120,175 65,143 65,77" fill="#1c1917" stroke="#ea580c" stroke-width="2.5" opacity="0.95"/>
  
  <!-- Subtle Internal Tech Lines -->
  <line x1="65" y1="77" x2="120" y2="110" stroke="#ea580c" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="175" y1="77" x2="120" y2="110" stroke="#ea580c" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="120" y1="175" x2="120" y2="110" stroke="#ea580c" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Monogram Letter "P" -->
  <text x="120" y="136" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="800" fill="url(#accentGrad)" text-anchor="middle" filter="url(#glow)">P</text>

  <!-- Tech Dots / Nodes -->
  <circle cx="120" cy="45" r="4.5" fill="#f97316"/>
  <circle cx="175" cy="77" r="4.5" fill="#fb923c"/>
  <circle cx="175" cy="143" r="4.5" fill="#f97316"/>
  <circle cx="120" cy="175" r="4.5" fill="#ea580c"/>
  <circle cx="65" cy="143" r="4.5" fill="#fb923c"/>
  <circle cx="65" cy="77" r="4.5" fill="#f97316"/>

  <!-- Status indicator pill at bottom -->
  <g transform="translate(75, 192)">
    <rect width="90" height="22" rx="11" fill="#18181b" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="16" cy="11" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="15" font-family="sans-serif" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle" letter-spacing="0.5">OPEN TO WORK</text>
  </g>
</svg>
